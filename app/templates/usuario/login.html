{% extends 'base.html' %}

{% block titulo %} Mitoverso {% endblock %}

{% block conteudo %}

    <!--Principal-->
    <main>
        <section class="hero d-flex align-items-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">
                        <div class="card bg-black bg-opacity-50 text-light shadow-lg border-3 rounded-4">
                            <div class="card-body p-4">

                                <!--Titulo para section-->
                                <h3 class="text-center fw-bold text-warning mb-4">Login:</h3>

                                <!--Formulário-->
                                <form>

                                    <!--Email-->
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" name="email" class="form-control form-control-lg" required>
                                    </div>

                                    <!--Senha-->
                                    <div class="mb-3">
                                        <label class="form-label">Senha</label>
                                        <input type="password" name="senha" class="form-control form-control-lg" required>
                                    </div>

                                    <!--Botão para entrar-->
                                    <div class="d-grid mt-4">
                                        <button type="submit" class="btn btn-warning btn-lg fw-bold rounded-pill">Entrar</button>
                                    </div>
                                </form>

                                <!--Link para cadastro-->
                                <p class="text-center mt-3 small">
                                    Não tem conta?
                                    <a href="{{ url_for('login') }}" class="text-warning text-decoration-none fw-semibold">Cadastre-se</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

{% endblock %}
