{% if paginacao.has_prev or paginacao.has_next %}
    <nav class="d-flex justify-content-between mt-4" aria-label="Paginação">
        {% if paginacao.has_prev %}
            <a href="{{ url_pagina(paginacao.prev_num) }}" class="btn btn-outline-mitoverso rounded-pill px-4">
                <i class="bi bi-arrow-left"></i> Mais novos
            </a>
        {% else %}<span></span>{% endif %}

        {% if paginacao.has_next %}
            <a href="{{ url_pagina(paginacao.next_num) }}" class="btn btn-outline-mitoverso rounded-pill px-4">
                Mais antigos <i class="bi bi-arrow-right"></i>
            </a>
        {% endif %}
    </nav>
{% endif %}
